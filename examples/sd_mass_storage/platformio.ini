; Teensy4TinyUSB example: the SD card as a USB drive. Needs a Teensy 4.1 (the one with the SD slot).
; Build and flash with `pio run -t upload` in this directory.
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = symlink://../..   ; this library, from the checkout. In your own project: oryomei/Teensy4TinyUSB@^0.1.0
build_flags =
	-DUSB_DISABLED      ; required: switches the Teensy core's USB off; Teensy4TinyUSB drives the port instead
