; Teensy4TinyUSB example: CDC serial echo. Build and flash with `pio run -t upload` in this directory.
[env:teensy41]
platform = teensy
board = teensy41             ; teensy40 and teensymm work the same way
framework = arduino
lib_deps = symlink://../..   ; this library, from the checkout. In your own project: Teensy4TinyUSB (or its git URL)
build_flags =
	-DUSB_DISABLED      ; required: switches the Teensy core's USB off; Teensy4TinyUSB drives the port instead
	-DCFG_TUD_MSC=0     ; serial only (the default is serial + Mass Storage)
